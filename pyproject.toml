[tool.poetry]
name = "body.e"
version = "0.0.1"
description = ""
authors = ["Christian Picofazzi <picofazzi.christian@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.13.1"
numpy = "^1.26.4"
pandas = "^2.2.3"
matplotlib = "^3.4.3"
ruff = "^0.8.4"  # Update version as needed
streamlit = "^1.41.1"
plotly = "^5.24.1"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"  # Ruff uses Pytest for testing
black = "^22.3.0"
flake8 = "^4.0.1"

[tool.poetry.scripts]
test = "python -m pytest tests"
lint = "ruff --fix . && black --check . && flake8"